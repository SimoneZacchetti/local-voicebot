name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Apple Silicon like the real target: MLX wheels are native there, and Linux would pull
    # several GB of CUDA packages with torch. Tests use fake STT/LLM/TTS, so no model is downloaded.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format github .

      - name: Import check
        run: uv run python -c "import server.main"

      - name: Tests
        run: uv run pytest -q
