<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Voicebot · Latenza</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #07080c;
      --surface: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f2f4f8;
      --muted: rgba(242, 244, 248, 0.55);
      --accent: #4d8dff;
      --warn: #f5a524;
      --danger: #ff5a5f;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f8fb;
        --surface: rgba(10, 20, 40, 0.05);
        --border: rgba(10, 20, 40, 0.08);
        --text: #0d1220;
        --muted: rgba(13, 18, 32, 0.55);
        --accent: #2563eb;
        --warn: #b26b00;
        --danger: #e5484d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    h1 { font-size: 22px; margin: 0; }
    h2 { font-size: 15px; margin: 32px 0 10px; color: var(--muted); font-weight: 600; }
    a { color: var(--accent); }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    select, button {
      font: inherit; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
    }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 20px; }
    .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .tile .label { color: var(--muted); font-size: 13px; }
    .tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
    .tile .sub { color: var(--muted); font-size: 12px; }
    .scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; min-width: 480px; }
    th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: 500; font-size: 13px; }
    tr:last-child td { border-bottom: 0; }
    .ok { color: var(--text); }
    .slow { color: var(--warn); }
    .bad { color: var(--danger); }
    .muted { color: var(--muted); }
    .bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--accent); vertical-align: middle; }
    .empty { color: var(--muted); padding: 24px 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Latenza</h1>
      <div class="controls">
        <select id="hours" aria-label="Periodo">
          <option value="1">Ultima ora</option>
          <option value="24" selected>Ultime 24 ore</option>
          <option value="168">Ultimi 7 giorni</option>
          <option value="720">Ultimi 30 giorni</option>
        </select>
        <select id="source" aria-label="Origine">
          <option value="">Tutte le origini</option>
          <option value="voice">Voce</option>
          <option value="chat">Chat</option>
        </select>
        <button id="refresh">Aggiorna</button>
      </div>
    </header>

    <div id="content"><p class="empty">Caricamento…</p></div>

    <p class="muted" style="margin-top:32px">
      Tempi in millisecondi dalla fine della frase (voce) o dall'invio (chat).
      Il primo audio non include l'attesa del silenzio del VAD. <a href="./">Torna all'assistente</a>
    </p>
  </main>

  <script>
    const LABELS = {
      stt_ms: "Trascrizione (STT)",
      llm_ttft_ms: "LLM, primo token",
      llm_tool_call_ms: "LLM, chiamata tool",
      llm_after_tools_ttft_ms: "LLM dopo i tool",
      first_audio_ms: "Primo audio",
      total_ms: "Turno completo",
    };
    const SOURCES = { voice: "Voce", chat: "Chat" };
    // Colour thresholds for time to first audio (target ~0.5 s).
    const SLOW_MS = 1000, BAD_MS = 2000;

    const $ = (id) => document.getElementById(id);
    const ms = (v) => (v == null ? "–" : v >= 10000 ? `${(v / 1000).toFixed(1)} s` : `${Math.round(v)}`);
    const tone = (v) => (v == null ? "muted" : v >= BAD_MS ? "bad" : v >= SLOW_MS ? "slow" : "ok");
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

    function tile(label, value, sub, cls = "") {
      return `<div class="tile"><div class="label">${label}</div><div class="value ${cls}">${value}</div><div class="sub">${sub}</div></div>`;
    }

    function render(d) {
      if (!d.enabled) return `<p class="empty">Statistiche disattivate (STATS_ENABLED=false).</p>`;
      if (!d.turns) return `<p class="empty">Nessun turno nel periodo scelto.</p>`;
      const fa = d.metrics.first_audio_ms;
      const parts = Object.entries(d.by_source).filter(([, n]) => n).map(([k, n]) => `${SOURCES[k] || k} ${n}`);
      let html = `<div class="tiles">
        ${tile("Primo audio p50", ms(fa.p50), "ms", tone(fa.p50))}
        ${tile("Primo audio p95", ms(fa.p95), "ms", tone(fa.p95))}
        ${tile("Turni", d.turns, parts.join(" · ") || "–")}
        ${tile("Con azioni in casa", d.with_actions, Object.entries(d.by_llm).map(([k, n]) => `${esc(k)} ${n}`).join(" · "))}
      </div>`;

      html += `<h2>Fasi</h2><div class="scroll"><table>
        <tr><th>Fase</th><th>Turni</th><th>p50</th><th>p95</th><th>Max</th></tr>`;
      for (const [key, m] of Object.entries(d.metrics)) {
        if (!m.n) continue;
        html += `<tr><td>${LABELS[key] || esc(key)}</td><td>${m.n}</td><td>${ms(m.p50)}</td><td>${ms(m.p95)}</td><td>${ms(m.max)}</td></tr>`;
      }
      html += `</table></div>`;

      if (d.daily.length > 1) {
        const top = Math.max(...d.daily.map((x) => x.first_audio_ms.p95 || 0), 1);
        html += `<h2>Primo audio per giorno</h2><div class="scroll"><table>
          <tr><th>Giorno</th><th>Turni</th><th>p50</th><th>p95</th><th style="width:40%"></th></tr>`;
        for (const day of [...d.daily].reverse()) {
          const m = day.first_audio_ms;
          const w = m.p95 ? Math.max(2, (m.p95 / top) * 100) : 0;
          html += `<tr><td>${day.day}</td><td>${day.turns}</td><td class="${tone(m.p50)}">${ms(m.p50)}</td>
            <td class="${tone(m.p95)}">${ms(m.p95)}</td><td style="text-align:left"><span class="bar" style="width:${w}%"></span></td></tr>`;
        }
        html += `</table></div>`;
      }

      html += `<h2>Ultimi turni</h2><div class="scroll"><table>
        <tr><th>Ora</th><th>Origine</th><th>Lingua</th><th>LLM</th><th>STT</th><th>Primo token</th><th>Primo audio</th><th>Totale</th></tr>`;
      for (const t of d.recent) {
        const m = t.metrics;
        const when = new Date(t.ts * 1000).toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        html += `<tr><td>${when}${t.actions ? " 🏠" : ""}</td><td>${SOURCES[t.source] || esc(t.source)}</td><td>${esc(t.lang)}</td>
          <td>${esc(t.llm)}</td><td>${ms(m.stt_ms)}</td><td>${ms(m.llm_ttft_ms ?? m.llm_tool_call_ms)}</td>
          <td class="${tone(m.first_audio_ms)}">${ms(m.first_audio_ms)}</td><td>${ms(m.total_ms)}</td></tr>`;
      }
      return html + `</table></div>`;
    }

    async function load() {
      const q = new URLSearchParams({ hours: $("hours").value });
      if ($("source").value) q.set("source", $("source").value);
      try {
        const res = await fetch(`stats.json?${q}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        $("content").innerHTML = render(await res.json());
      } catch (e) {
        $("content").innerHTML = `<p class="empty">Impossibile caricare le statistiche: ${esc(e.message)}</p>`;
      }
    }

    for (const id of ["hours", "source"]) $(id).addEventListener("change", load);
    $("refresh").addEventListener("click", load);
    load();
    setInterval(() => document.hidden || load(), 30000);
  </script>
</body>
</html>
